<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>パチスロ切り抜き司令塔 v1.1</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
button, .bar-hit, .tm { touch-action: manipulation; user-select: none; -webkit-user-select: none; }
body { background: #121212; color: #e0e0e0; display: flex; flex-direction: column; height: 100vh; height: 100dvh; max-width: 480px; margin: 0 auto; padding-bottom: env(safe-area-inset-bottom, 0px); }
header { background: #1f1f1f; padding: 8px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-top: calc(8px + env(safe-area-inset-top, 0px)); }
header h1 { font-size: 16px; color: #ff9800; }
.header-actions button { background: #333; color: #fff; border: none; padding: 0 12px; min-height: 36px; border-radius: 4px; font-size: 12px; }
.file-select-bar { padding: 6px 15px; background: #181818; font-size: 12px; border-bottom: 1px solid #333; display: flex; align-items: center; gap: 10px; }
.file-select-bar input { flex: 1; min-width: 0; font-size: 12px; }
.video-container { width: 100%; background: #000; }
video { width: 100%; display: block; max-height: 220px; object-fit: contain; }
.seek-bars { padding: 2px 15px 6px; background: #1a1a1a; border-bottom: 1px solid #333; }
.bar-hit { padding: 11px 0; touch-action: none; cursor: pointer; }
.seekbar-red { width: 100%; height: 8px; background: #d32f2f; border-radius: 4px; position: relative; overflow: hidden; }
.seekbar-green-box { width: 100%; height: 18px; background: rgba(76,175,80,.2); border: 1px solid #4caf50; border-radius: 4px; position: relative; overflow: hidden; }
.seg { position: absolute; top: 0; bottom: 0; background: rgba(255,255,255,.55); min-width: 2px; }
.seg.sel { background: #ffeb3b; }
.mk { position: absolute; top: 0; bottom: 0; width: 3px; margin-left: -1px; }
.mk.s { background: #ff9800; } .mk.e { background: #ffeb3b; }
.mk.f { box-shadow: 0 0 0 2px #fff; }
.zone { position: absolute; top: 0; bottom: 0; background: rgba(255,235,59,.25); }
.playhead { position: absolute; top: -2px; bottom: -2px; width: 2px; margin-left: -1px; background: #fff; z-index: 3; }
.win-row { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #aaa; font-variant-numeric: tabular-nums; }
.mini { background: #333; color: #fff; border: none; border-radius: 4px; padding: 0 10px; min-height: 32px; font-size: 12px; }
.timeline-section { flex: 1; overflow-y: auto; padding: 0 10px 10px; background: #161616; min-height: 60px; }
.list-head { position: sticky; top: 0; background: #161616; z-index: 2; display: flex; justify-content: space-between; align-items: center; padding: 6px 0; font-size: 12px; color: #aaa; }
.empty { font-size: 12px; color: #777; padding: 12px 4px; }
.clip-card { background: #222; border-left: 4px solid #ff9800; padding: 10px; margin-bottom: 8px; border-radius: 4px; font-size: 13px; }
.clip-card.active { border-left-color: #4caf50; background: #2a2a2a; }
.clip-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-variant-numeric: tabular-nums; }
.tm { padding: 6px 4px; border-radius: 4px; font-weight: normal; }
.tm.f { background: #ff9800; color: #000; font-weight: bold; }
.del { background: none; border: none; color: #888; font-size: 16px; min-width: 40px; min-height: 36px; }
.telop { min-height: 28px; padding: 4px 0; word-break: break-all; }
.telop i { color: #777; }
.control-panel { background: #1f1f1f; padding: 10px 15px; border-top: 1px solid #333; }
.time-assign-row { display: flex; gap: 8px; margin-bottom: 8px; }
.btn { flex: 1; min-height: 46px; border: none; border-radius: 6px; font-weight: bold; font-size: 13px; }
.btn-primary { background: #ff9800; color: #000; }
.btn-success { background: #4caf50; color: #fff; }
.btn-secondary { background: #333; color: #fff; }
.btn-secondary.on { background: #2196f3; }
.fine-tune-row { display: flex; gap: 6px; }
.fine-tune-row button { flex: 1; min-height: 46px; background: #2c2c2c; color: #ddd; border: 1px solid #444; border-radius: 4px; font-size: 14px; }
.fine-tune-row button:active { background: #555; }
.target { font-size: 11px; color: #aaa; margin-bottom: 4px; }
#toast { position: fixed; top: calc(52px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.9); color: #fff; border: 1px solid #555; padding: 8px 14px; border-radius: 6px; font-size: 12px; z-index: 10; display: none; max-width: 90%; text-align: center; }
</style>
</head>
<body>

<header>
  <h1>🎰 司令塔 v1.1</h1>
    <div class="header-actions"><button id="exportBtn">💾 JSON</button></div>
    </header>

    <div class="file-select-bar">
      <span>プロキシ読込:</span>
        <input type="file" id="videoFile" accept="video/*">
        </div>

        <div class="video-container"><video id="player" controls playsinline></video></div>

        <div class="seek-bars">
          <div class="bar-hit" id="redHit">
              <div class="seekbar-red"><div id="redSegs"></div><div class="playhead" id="redHead"></div></div>
                </div>
                  <div class="bar-hit" id="greenHit">
                      <div class="seekbar-green-box"><div id="greenMarks"></div><div class="playhead" id="greenHead"></div></div>
                        </div>
                          <div class="win-row"><span id="timeLabel">00:00:00.0 / 00:00:00.0</span><button class="mini" id="winBtn">窓 ±30s</button></div>
                          </div>

                          <div class="timeline-section" id="clipList"></div>

                          <div class="control-panel">
                            <div class="time-assign-row">
                                <button class="btn btn-primary" id="setStart">▶ 開始セット</button>
                                    <button class="btn btn-success" id="setEnd">終了セット ⏹</button>
                                        <button class="btn btn-secondary" id="loopBtn">🔄 ループ</button>
                                          </div>
                                            <div class="target" id="targetLabel">微調整: 再生位置</div>
                                              <div class="fine-tune-row">
                                                  <button data-d="-10">-10s</button>
                                                      <button data-d="-1">-1s</button>
                                                          <button data-d="1">+1s</button>
                                                              <button data-d="10">+10s</button>
                                                                </div>
                                                                </div>

                                                                <div id="toast"></div>

                                                                <script>
                                                                const $ = id => document.getElementById(id);
                                                                const player = $('player');
                                                                const MIN = 0.5;                 // 最小尺(秒)
                                                                const WINS = [15, 30, 90, 300];  // 緑バーの窓(±秒)

                                                                let clips = [], sel = null, focus = 'end', loop = false;
                                                                let fileKey = null, fileMeta = null, nextId = 1, winIdx = 1;
                                                                let frozen = null, raf = 0, toastTimer = 0;

                                                                const dur = () => player.duration || 0;
                                                                const cur = () => player.currentTime || 0;
                                                                const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
                                                                const r2 = v => Math.round(v * 100) / 100;
                                                                const getSel = () => clips.find(c => c.id === sel) || null;
                                                                const esc = s => String(s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
                                                                const pct = (t, s, e) => e > s ? clamp((t - s) / (e - s), 0, 1) * 100 : 0;

                                                                function fmt(t) {
                                                                  if (t == null) return '--:--:--.-';
                                                                    const n = Math.floor(t * 10 + 1e-6);
                                                                      const h = Math.floor(n / 36000), m = Math.floor(n / 600) % 60, s = Math.floor(n / 10) % 60, d = n % 10;
                                                                        return String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0') + '.' + d;
                                                                        }
                                                                        function toast(msg) {
                                                                          const t = $('toast'); t.textContent = msg; t.style.display = 'block';
                                                                            clearTimeout(toastTimer); toastTimer = setTimeout(() => t.style.display = 'none', 1800);
                                                                            }

                                                                            /* ---------- 保存・復元 ---------- */
                                                                            function save() {
                                                                              if (!fileKey) return;
                                                                                try { localStorage.setItem(fileKey, JSON.stringify({ clips, sel, nextId, focus, winIdx })); }
                                                                                  catch (e) { toast('自動保存に失敗。JSONを書き出して退避してください'); }
                                                                                  }

                                                                                  /* ---------- 動画読込 ---------- */
                                                                                  $('videoFile').addEventListener('change', e => {
                                                                                    const f = e.target.files[0]; if (!f) return;
                                                                                      if (player.dataset.url) URL.revokeObjectURL(player.dataset.url);
                                                                                        const u = URL.createObjectURL(f);
                                                                                          player.dataset.url = u; player.src = u;
                                                                                            fileMeta = { name: f.name, size: f.size };
                                                                                              fileKey = null; clips = []; sel = null; nextId = 1; render();
                                                                                              });
                                                                                              player.addEventListener('loadedmetadata', () => {
                                                                                                if (!fileMeta) return;
                                                                                                  fileMeta.duration = r2(dur());
                                                                                                    fileKey = 'sokan:' + fileMeta.name + ':' + fileMeta.size + ':' + Math.round(dur());
                                                                                                      try {
                                                                                                          const s = JSON.parse(localStorage.getItem(fileKey) || 'null');
                                                                                                              if (s) {
                                                                                                                    clips = s.clips || []; sel = s.sel; nextId = s.nextId || 1;
                                                                                                                          focus = s.focus || 'end'; winIdx = s.winIdx != null ? s.winIdx : 1;
                                                                                                                                toast('前回の編集を復元しました（' + clips.length + '件）');
                                                                                                                                    }
                                                                                                                                      } catch (e) {}
                                                                                                                                        render();
                                                                                                                                        });
                                                                                                                                        player.addEventListener('error', () => toast('この動画は再生できません（形式を確認）'));

                                                                                                                                        /* ---------- 操作 ---------- */
                                                                                                                                        function ready() { if (!dur()) { toast('先にプロキシ動画を読み込んでください'); return false; } return true; }

                                                                                                                                        function setTimestamp(type) {
                                                                                                                                          if (!ready()) return;
                                                                                                                                            const t = r2(cur());
                                                                                                                                              let c = getSel();
                                                                                                                                                if (type === 'start') {
                                                                                                                                                    if (!c || (c.end != null && t >= c.end)) {
                                                                                                                                                          c = { id: nextId++, start: t, end: null, telop: '' };
                                                                                                                                                                clips.push(c); sel = c.id;
                                                                                                                                                                    } else {
                                                                                                                                                                          if (c.end != null && t > c.end - MIN) return toast('開始は終了より ' + MIN + '秒以上前にしてください');
                                                                                                                                                                                c.start = t;
                                                                                                                                                                                    }
                                                                                                                                                                                        focus = 'start';
                                                                                                                                                                                          } else {
                                                                                                                                                                                              if (!c) return toast('先に開始をセットしてください');
                                                                                                                                                                                                  if (t < c.start + MIN) return toast('終了は開始より ' + MIN + '秒以上後にしてください');
                                                                                                                                                                                                      c.end = t; focus = 'end';
                                                                                                                                                                                                        }
                                                                                                                                                                                                          save(); render();
                                                                                                                                                                                                          }

                                                                                                                                                                                                          function adjust(delta) {
                                                                                                                                                                                                            const c = getSel();
                                                                                                                                                                                                              if (!ready()) return;
                                                                                                                                                                                                                if (!c) { player.currentTime = clamp(cur() + delta, 0, dur()); return; }
                                                                                                                                                                                                                  let v = (c[focus] != null ? c[focus] : cur()) + delta;
                                                                                                                                                                                                                    v = clamp(v, 0, dur());
                                                                                                                                                                                                                      if (focus === 'start' && c.end != null) v = Math.min(v, c.end - MIN);
                                                                                                                                                                                                                        if (focus === 'end') v = Math.max(v, c.start + MIN);
                                                                                                                                                                                                                          v = clamp(r2(v), 0, dur());
                                                                                                                                                                                                                            c[focus] = v;
                                                                                                                                                                                                                              player.currentTime = v;
                                                                                                                                                                                                                                save(); render();
                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                function toggleLoop() {
                                                                                                                                                                                                                                  const c = getSel();
                                                                                                                                                                                                                                    if (!loop && !(c && c.end != null)) return toast('開始・終了が揃った切り出しを選択してください');
                                                                                                                                                                                                                                      loop = !loop;
                                                                                                                                                                                                                                        if (loop) { player.currentTime = c.start; player.play(); }
                                                                                                                                                                                                                                          render();
                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                          /* ---------- シークバー ---------- */
                                                                                                                                                                                                                                          function bindScrub(el, toTime, onStart, onEnd) {
                                                                                                                                                                                                                                            let on = false;
                                                                                                                                                                                                                                              const go = e => {
                                                                                                                                                                                                                                                  const rc = el.getBoundingClientRect();
                                                                                                                                                                                                                                                      player.currentTime = toTime(clamp((e.clientX - rc.left) / rc.width, 0, 1));
                                                                                                                                                                                                                                                          renderHeads();
                                                                                                                                                                                                                                                            };
                                                                                                                                                                                                                                                              el.addEventListener('pointerdown', e => {
                                                                                                                                                                                                                                                                  if (!dur()) return;
                                                                                                                                                                                                                                                                      on = true; el.setPointerCapture(e.pointerId);
                                                                                                                                                                                                                                                                          if (onStart) onStart(); go(e);
                                                                                                                                                                                                                                                                            });
                                                                                                                                                                                                                                                                              el.addEventListener('pointermove', e => { if (on) go(e); });
                                                                                                                                                                                                                                                                                const end = () => { if (on) { on = false; if (onEnd) onEnd(); } };
                                                                                                                                                                                                                                                                                  el.addEventListener('pointerup', end);
                                                                                                                                                                                                                                                                                    el.addEventListener('pointercancel', end);
                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                    bindScrub($('redHit'), p => p * dur());
                                                                                                                                                                                                                                                                                    bindScrub($('greenHit'),
                                                                                                                                                                                                                                                                                      p => frozen.s + p * (frozen.e - frozen.s),
                                                                                                                                                                                                                                                                                        () => { frozen = getWin(); },
                                                                                                                                                                                                                                                                                          () => { frozen = null; renderHeads(); });

                                                                                                                                                                                                                                                                                          $('winBtn').addEventListener('click', () => { winIdx = (winIdx + 1) % WINS.length; save(); renderHeads(); });

                                                                                                                                                                                                                                                                                          function getWin() {
                                                                                                                                                                                                                                                                                            if (frozen) return frozen;
                                                                                                                                                                                                                                                                                              const d = dur(), span = Math.min(WINS[winIdx] * 2, d);
                                                                                                                                                                                                                                                                                                const s = clamp(cur() - span / 2, 0, Math.max(0, d - span));
                                                                                                                                                                                                                                                                                                  return { s, e: s + span };
                                                                                                                                                                                                                                                                                                  }

                                                                                                                                                                                                                                                                                                  /* ---------- 描画 ---------- */
                                                                                                                                                                                                                                                                                                  function renderList() {
                                                                                                                                                                                                                                                                                                    const L = $('clipList');
                                                                                                                                                                                                                                                                                                      let h = '<div class="list-head"><span>切り出し ' + clips.length + '件</span><button class="mini" data-act="new">＋新規</button></div>';
                                                                                                                                                                                                                                                                                                        if (!clips.length) h += '<div class="empty">動画を読み込み、再生しながら「開始セット」を押す</div>';
                                                                                                                                                                                                                                                                                                          clips.forEach(c => {
                                                                                                                                                                                                                                                                                                              const a = c.id === sel;
                                                                                                                                                                                                                                                                                                                  h += '<div class="clip-card' + (a ? ' active' : '') + '" data-id="' + c.id + '">' +
                                                                                                                                                                                                                                                                                                                        '<div class="clip-info"><span>' +
                                                                                                                                                                                                                                                                                                                              '<b class="tm' + (a && focus === 'start' ? ' f' : '') + '" data-act="start">' + fmt(c.start) + '</b> - ' +
                                                                                                                                                                                                                                                                                                                                    '<b class="tm' + (a && focus === 'end' ? ' f' : '') + '" data-act="end">' + fmt(c.end) + '</b></span>' +
                                                                                                                                                                                                                                                                                                                                          '<span>' + (a ? '[選択中] ' : '') + '<button class="del" data-act="del">✕</button></span></div>' +
                                                                                                                                                                                                                                                                                                                                                '<div class="telop" data-act="telop">' + (c.telop ? esc(c.telop) : '<i>テロップ（タップで入力）</i>') + '</div></div>';
                                                                                                                                                                                                                                                                                                                                                  });
                                                                                                                                                                                                                                                                                                                                                    const top = L.scrollTop;
                                                                                                                                                                                                                                                                                                                                                      L.innerHTML = h; L.scrollTop = top;
                                                                                                                                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                                                                                                                                      function renderSegs() {
                                                                                                                                                                                                                                                                                                                                                        const d = dur(); let h = '';
                                                                                                                                                                                                                                                                                                                                                          if (d) clips.forEach(c => {
                                                                                                                                                                                                                                                                                                                                                              const l = pct(c.start, 0, d), w = c.end != null ? pct(c.end, 0, d) - l : 0.6;
                                                                                                                                                                                                                                                                                                                                                                  h += '<div class="seg' + (c.id === sel ? ' sel' : '') + '" style="left:' + l + '%;width:' + w + '%"></div>';
                                                                                                                                                                                                                                                                                                                                                                    });
                                                                                                                                                                                                                                                                                                                                                                      $('redSegs').innerHTML = h;
                                                                                                                                                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                                                                                                                                                      function renderHeads() {
                                                                                                                                                                                                                                                                                                                                                                        const d = dur();
                                                                                                                                                                                                                                                                                                                                                                          $('timeLabel').textContent = fmt(cur()) + ' / ' + fmt(d);
                                                                                                                                                                                                                                                                                                                                                                            $('winBtn').textContent = '窓 ±' + WINS[winIdx] + 's';
                                                                                                                                                                                                                                                                                                                                                                              if (!d) return;
                                                                                                                                                                                                                                                                                                                                                                                $('redHead').style.left = pct(cur(), 0, d) + '%';
                                                                                                                                                                                                                                                                                                                                                                                  const w = getWin();
                                                                                                                                                                                                                                                                                                                                                                                    $('greenHead').style.left = pct(cur(), w.s, w.e) + '%';
                                                                                                                                                                                                                                                                                                                                                                                      const c = getSel(); let h = '';
                                                                                                                                                                                                                                                                                                                                                                                        if (c) {
                                                                                                                                                                                                                                                                                                                                                                                            const e = c.end != null ? c.end : c.start;
                                                                                                                                                                                                                                                                                                                                                                                                if (c.end != null && e > w.s && c.start < w.e)
                                                                                                                                                                                                                                                                                                                                                                                                      h += '<div class="zone" style="left:' + pct(c.start, w.s, w.e) + '%;width:' + (pct(e, w.s, w.e) - pct(c.start, w.s, w.e)) + '%"></div>';
                                                                                                                                                                                                                                                                                                                                                                                                          if (c.start >= w.s && c.start <= w.e) h += '<div class="mk s' + (focus === 'start' ? ' f' : '') + '" style="left:' + pct(c.start, w.s, w.e) + '%"></div>';
                                                                                                                                                                                                                                                                                                                                                                                                              if (c.end != null && c.end >= w.s && c.end <= w.e) h += '<div class="mk e' + (focus === 'end' ? ' f' : '') + '" style="left:' + pct(c.end, w.s, w.e) + '%"></div>';
                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                  $('greenMarks').innerHTML = h;
                                                                                                                                                                                                                                                                                                                                                                                                                  }

                                                                                                                                                                                                                                                                                                                                                                                                                  function render() {
                                                                                                                                                                                                                                                                                                                                                                                                                    renderList(); renderSegs(); renderHeads();
                                                                                                                                                                                                                                                                                                                                                                                                                      $('loopBtn').classList.toggle('on', loop);
                                                                                                                                                                                                                                                                                                                                                                                                                        const c = getSel();
                                                                                                                                                                                                                                                                                                                                                                                                                          $('targetLabel').textContent = c ? '微調整: ' + (focus === 'start' ? '開始' : '終了') + '時刻（' + fmt(c[focus]) + '）' : '微調整: 再生位置';
                                                                                                                                                                                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                                                                                                                                                                                          /* ---------- 再生中の更新・ループ ---------- */
                                                                                                                                                                                                                                                                                                                                                                                                                          function tick() {
                                                                                                                                                                                                                                                                                                                                                                                                                            renderHeads();
                                                                                                                                                                                                                                                                                                                                                                                                                              const c = getSel();
                                                                                                                                                                                                                                                                                                                                                                                                                                if (loop && c && c.end != null && cur() >= c.end) player.currentTime = c.start;
                                                                                                                                                                                                                                                                                                                                                                                                                                  if (!player.paused) raf = requestAnimationFrame(tick);
                                                                                                                                                                                                                                                                                                                                                                                                                                  }
                                                                                                                                                                                                                                                                                                                                                                                                                                  player.addEventListener('play', () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(tick); });
                                                                                                                                                                                                                                                                                                                                                                                                                                  player.addEventListener('pause', () => { cancelAnimationFrame(raf); renderHeads(); });
                                                                                                                                                                                                                                                                                                                                                                                                                                  ['seeking', 'seeked', 'timeupdate'].forEach(ev => player.addEventListener(ev, renderHeads));

                                                                                                                                                                                                                                                                                                                                                                                                                                  /* ---------- リスト操作 ---------- */
                                                                                                                                                                                                                                                                                                                                                                                                                                  $('clipList').addEventListener('click', e => {
                                                                                                                                                                                                                                                                                                                                                                                                                                    const t = e.target.closest('[data-act]'); if (!t) return;
                                                                                                                                                                                                                                                                                                                                                                                                                                      const act = t.dataset.act;
                                                                                                                                                                                                                                                                                                                                                                                                                                        if (act === 'new') { sel = null; loop = false; save(); render(); return; }
                                                                                                                                                                                                                                                                                                                                                                                                                                          const card = e.target.closest('.clip-card'); if (!card) return;
                                                                                                                                                                                                                                                                                                                                                                                                                                            const c = clips.find(x => x.id == card.dataset.id); if (!c) return;
                                                                                                                                                                                                                                                                                                                                                                                                                                              if (act === 'del') {
                                                                                                                                                                                                                                                                                                                                                                                                                                                  if (confirm('この切り出しを削除しますか？')) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                        clips = clips.filter(x => x !== c);
                                                                                                                                                                                                                                                                                                                                                                                                                                                              if (sel === c.id) { sel = null; loop = false; }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    save(); render();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                            return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                              }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                sel = c.id;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  if (act === 'telop') {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      const v = prompt('テロップ', c.telop || '');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          if (v !== null) c.telop = v;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            } else if (act === 'start' || act === 'end') {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                focus = act;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if (c[act] != null && dur()) player.currentTime = c[act];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      } else if (dur()) player.currentTime = c.start;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        save(); render();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        });

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        $('setStart').addEventListener('click', () => setTimestamp('start'));
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        $('setEnd').addEventListener('click', () => setTimestamp('end'));
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        $('loopBtn').addEventListener('click', toggleLoop);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        document.querySelectorAll('.fine-tune-row button').forEach(b =>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          b.addEventListener('click', () => adjust(Number(b.dataset.d))));

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          /* ---------- JSON書き出し ---------- */
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          $('exportBtn').addEventListener('click', () => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if (!fileKey) return toast('先にプロキシ動画を読み込んでください');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              const done = clips.filter(c => c.end != null);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (!done.length) return toast('開始・終了が揃った切り出しがありません');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  if (done.length < clips.length) toast('終了未設定の ' + (clips.length - done.length) + '件は除外しました');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const base = fileMeta.name.replace(/\.[^.]+$/, '');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      const d = new Date(), p = n => String(n).padStart(2, '0');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const stamp = d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '_' + p(d.getHours()) + p(d.getMinutes());
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          const data = {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              schema_version: '0.3',
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  job_id: base + '_' + stamp,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      source: { proxy_file: fileMeta.name, proxy_size: fileMeta.size, proxy_duration_sec: fileMeta.duration, chunk_offset_sec: 0 },
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          output: { aspect: '9:16', crop_x: 0.5 },
